[package]
name = "rivet-vp9"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE.md"
readme = "README.md"
repository = "https://github.com/safewords/rivet-vp9"
homepage = "https://github.com/safewords/rivet-vp9"
documentation = "https://docs.rs/rivet-vp9"
authors = ["Ely Erin Fox"]
description = "A VP9 decoder and encoder in Rust, written from the VP9 Bitstream & Decoding Process Specification: no C, no system libraries, no build script. Profiles 0-3 (8/10/12-bit, 4:2:0 to 4:4:4) decoding, bit-exact against the WebM project's test vectors; an encoder for profiles 0-3 with rate-distortion partition and transform search and one- or two-pass rate control. rivet's VP9 codec. Imported as `vp9`."
keywords = ["vp9", "video", "decoder", "encoder", "codec"]
categories = ["multimedia::video", "multimedia::encoding"]
exclude = [".github/", "tools/", "tests/vectors/"]

[lib]
name = "vp9"

[dependencies]
thiserror = "2"

[dev-dependencies]
md5 = "0.7"
proptest = { version = "1", default-features = false, features = ["std"] }

[features]
default = []

# Tests keep debug assertions and overflow checks (the encoder compares its
# reconstruction with the decoder's in debug builds) but are optimised: the
# encoder's searches are slow unoptimised.
[profile.test]
opt-level = 2
