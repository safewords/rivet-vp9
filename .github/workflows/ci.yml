name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

# Every job runs on the safewords org's self-hosted runners
# (`safewords-runners`), pull requests from forks included: an outside
# contributor's workflow runs only once a maintainer approves it. CI is
# x86-64 Linux only. No Windows, macOS or arm64 jobs: the code stays
# portable, and the NEON (aarch64) paths are checked by hand on ARM hardware
# (README, "NEON on ARM hardware").

# id-token: a push to develop or main shows the compile cache's broker its
# OIDC token to be allowed to write the cache (ci-cache-setup).
permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The SIMD kernels are checked bit-exact against the scalar ones on
          # x86-64: SSE4.1 and AVX2 (NEON is checked by hand on ARM hardware,
          # see the README).
          # VP9_REQUIRE_SIMD makes a runner without them fail the kernel
          # tests rather than skip them: a skipped kernel test is
          # indistinguishable from a passing one.
          - { name: linux x86-64 (AVX2),  os: safewords-runners }
    env:
      VP9_REQUIRE_SIMD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - name: Tests (committed vectors, encoder, units), SIMD kernels
        run: cargo test --release
      - name: The same with the scalar kernels, one thread
        run: cargo test --release
        env:
          VP9_FORCE_SCALAR: "1"
          VP9_TEST_THREADS: "1"
      - name: Property tests and encoder self-check with debug assertions and overflow checks (test profile, optimised)
        run: cargo test --test fuzz --test encode

  # The full set of public VP9 test vectors (about 34 MB), downloaded from
  # the WebM project's test-data bucket. Without the download the test
  # skips; VP9_REQUIRE_VECTORS makes a missing set a failure here. Every
  # vector is decoded with the SIMD kernels on all cores, and again with
  # the scalar kernels on one thread.
  vectors:
    name: test vectors (353 streams, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86-64, os: safewords-runners }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - uses: actions/cache@v4
        with:
          path: tests/vectors
          key: vp9-vectors-${{ hashFiles('tools/vectors.txt') }}
      - run: tools/fetch-vectors.sh
      - name: Decode every vector, compare every frame's MD5 (SIMD, threads)
        run: cargo test --release --test vectors -- --nocapture
        env:
          VP9_REQUIRE_VECTORS: "1"
      - name: Decode every vector, compare every frame's MD5 (scalar, one thread)
        run: cargo test --release --test vectors -- --nocapture
        env:
          VP9_REQUIRE_VECTORS: "1"
          VP9_FORCE_SCALAR: "1"
          VP9_TEST_THREADS: "1"

  msrv:
    name: MSRV (1.99)
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - run: cargo build --release

  lint:
    name: rustfmt, clippy and rustdoc
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # rivet's compile cache, warmed with this commit before rivet's submodule is
  # bumped to it: the commit built inside rivet exactly as rivet's CI builds
  # it (safewords/rivet-transcoder .github/workflows/codec-cache-warmup.yml).
  # Never fails this workflow.
  rivet-cache:
    name: warm rivet's compile cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    uses: safewords/rivet-transcoder/.github/workflows/codec-cache-warmup.yml@develop
    with:
      crates: rivet-vp9
      submodule: crates/vp9
