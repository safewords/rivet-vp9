name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

# Every job runs on the safewords org's self-hosted runners
# (`safewords-runners`), pull requests from forks included: an outside
# contributor's workflow runs only once a maintainer approves it. arm64 is
# covered on the same x86-64 runners: cross-compiled for
# aarch64-unknown-linux-gnu and run under QEMU's user-mode emulator, so the
# NEON kernels are still checked against the scalar ones. No Windows or macOS
# CI: the code stays portable, but nothing here tests it there.

jobs:
  test:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The SIMD kernels are checked bit-exact against the scalar ones on
          # every host: SSE4.1 and AVX2 on x86-64, NEON on arm64.
          # VP9_REQUIRE_SIMD makes a runner without them fail the kernel
          # tests rather than skip them: a skipped kernel test is
          # indistinguishable from a passing one.
          - { name: linux x86-64 (AVX2),  os: safewords-runners }
          - { name: linux arm64 (NEON) under QEMU,   os: safewords-runners, target: aarch64-unknown-linux-gnu }
    env:
      VP9_REQUIRE_SIMD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: aarch64 cross toolchain and QEMU
        # The arm64 entry: cargo builds for aarch64-unknown-linux-gnu and runs
        # every test binary under qemu-aarch64. The runner image has these;
        # the install is a fallback for an image that predates them.
        if: matrix.target
        run: |
          if ! command -v qemu-aarch64 >/dev/null || ! command -v aarch64-linux-gnu-gcc >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
          fi
          {
            echo "CARGO_BUILD_TARGET=${{ matrix.target }}"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER=qemu-aarch64 -L /usr/aarch64-linux-gnu"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Tests (committed vectors, encoder, units), SIMD kernels
        run: cargo test --release
      - name: The same with the scalar kernels, one thread
        run: cargo test --release
        env:
          VP9_FORCE_SCALAR: "1"
          VP9_TEST_THREADS: "1"
      - name: Property tests and encoder self-check with debug assertions and overflow checks (test profile, optimised)
        run: cargo test --test fuzz --test encode

  # The full set of public VP9 test vectors (about 34 MB), downloaded from
  # the WebM project's test-data bucket. Without the download the test
  # skips; VP9_REQUIRE_VECTORS makes a missing set a failure here. Every
  # vector is decoded with the SIMD kernels on all cores, and again with
  # the scalar kernels on one thread.
  vectors:
    name: test vectors (353 streams, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86-64, os: safewords-runners }
          - { name: arm64 under QEMU, os: safewords-runners, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: aarch64 cross toolchain and QEMU
        # The arm64 entry: cargo builds for aarch64-unknown-linux-gnu and runs
        # every test binary under qemu-aarch64. The runner image has these;
        # the install is a fallback for an image that predates them.
        if: matrix.target
        run: |
          if ! command -v qemu-aarch64 >/dev/null || ! command -v aarch64-linux-gnu-gcc >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
          fi
          {
            echo "CARGO_BUILD_TARGET=${{ matrix.target }}"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER=qemu-aarch64 -L /usr/aarch64-linux-gnu"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: tests/vectors
          key: vp9-vectors-${{ hashFiles('tools/vectors.txt') }}
      - run: tools/fetch-vectors.sh
      - name: Decode every vector, compare every frame's MD5 (SIMD, threads)
        run: cargo test --release --test vectors -- --nocapture
        env:
          VP9_REQUIRE_VECTORS: "1"
      - name: Decode every vector, compare every frame's MD5 (scalar, one thread)
        run: cargo test --release --test vectors -- --nocapture
        env:
          VP9_REQUIRE_VECTORS: "1"
          VP9_FORCE_SCALAR: "1"
          VP9_TEST_THREADS: "1"

  msrv:
    name: MSRV (1.99)
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  lint:
    name: rustfmt, clippy (x86-64 and aarch64) and rustdoc
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --target aarch64-unknown-linux-gnu -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
